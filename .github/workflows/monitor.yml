name: Restock Monitor

on:
  # 定时运行：每 5 分钟一次（GitHub 允许的最短间隔；高峰期可能延迟几分钟）
  # 如果你的仓库是 Private（私有），请改成 "*/30 * * * *"，否则每月免费额度不够用
  schedule:
    - cron: "*/5 * * * *"
  # 手动运行按钮（Actions 页面 → Run workflow）
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        required: true
        default: "check"
        type: choice
        options:
          - check        # 正常检测一次
          - test-email   # 只发测试邮件
          - test-bark    # 只发测试 Bark 警报

# 同一时间只跑一个，避免叠加
concurrency:
  group: restock-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 下载代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 缓存浏览器（加快速度）
        if: ${{ github.event.inputs.mode == '' || github.event.inputs.mode == 'check' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: 安装 Chromium 浏览器
        if: ${{ github.event.inputs.mode == '' || github.event.inputs.mode == 'check' }}
        run: python -m playwright install --with-deps chromium

      - name: 运行监控
        env:
          PRODUCT_URL: ${{ secrets.PRODUCT_URL }}
          IN_STOCK_TEXT: ${{ secrets.IN_STOCK_TEXT }}
          OUT_OF_STOCK_TEXT: ${{ secrets.OUT_OF_STOCK_TEXT }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAX_BUTTON_Y: ${{ secrets.MAX_BUTTON_Y }}
          MODE: ${{ github.event.inputs.mode || 'check' }}
        run: |
          case "$MODE" in
            test-email) python monitor.py --test-email ;;
            test-bark)  python monitor.py --test-bark ;;
            *)          python monitor.py ;;
          esac

      - name: 上传截图（仅在出错时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshot.png
          if-no-files-found: ignore
          retention-days: 7
